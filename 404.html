<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada – Realce Clin Odontologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <style>
    :root { --blue-700: #1B5EA0; --ink: #0F1923; --muted: #5A6B7C; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--ink);
      background: #F2F8FD;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    img { max-width: 160px; height: auto; margin: 0 auto 2rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--ink); margin-bottom: .75rem; }
    p  { color: var(--muted); font-size: 1rem; line-height: 1.65; max-width: 380px; margin: 0 auto 2rem; }
    a  {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--blue-700); color: #fff;
      padding: .75rem 1.75rem; border-radius: 40px;
      font-size: .95rem; font-weight: 600; text-decoration: none;
      transition: opacity .2s;
    }
    a:hover { opacity: .88; }
  </style>
</head>
<body>
  <img src="assets/img/logo-white.png" alt="Realce Clin Odontologia">
  <h1>Página não encontrada</h1>
  <p>A página que você procura não existe ou foi movida. Volte para o início e encontre o que precisa.</p>
  <a href="/">← Voltar ao início</a>
</body>
</html>
